<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>SGT | Elemento</title>


<link rel="stylesheet" href="../css/estilos.css">

<link rel="stylesheet" href="../css/elemento.css">


</head>


<body>



<header class="topbar">


<div>

<h1>
SGT
</h1>

<p>
Gestión de elementos
</p>


</div>



<button onclick="volverMapa()">

Volver mapa

</button>



</header>





<main class="contenedor">



<h2 id="titulo">

Nuevo elemento

</h2>




<form id="formElemento">



<label>
Tipo de elemento
</label>


<select id="tipoId" required>


<option value="">
Seleccione tipo
</option>


</select>





<label>
Código
</label>


<input 
id="codigo"
readonly
placeholder="Generado automáticamente">





<label>
Nombre / Referencia
</label>


<input 
id="nombre"
required>





<label>
Descripción
</label>


<textarea 
id="descripcion">
</textarea>





<label>
Dirección / Ubicación
</label>


<input 
id="direccion">






<label>
Latitud
</label>


<input 
id="lat"
readonly>





<label>
Longitud
</label>


<input 
id="lng"
readonly>





<button 
type="button"
onclick="obtenerGPS()">

Obtener ubicación GPS

</button>






<label>
Estado
</label>


<select id="estado">


<option>
Activo
</option>


<option>
Dañado
</option>


<option>
Fuera de servicio
</option>


<option>
Mantenimiento
</option>


</select>






<label>
Características
</label>


<textarea id="caracteristicas"></textarea>






<button 
type="button"
onclick="guardarElemento()">

Guardar elemento

</button>




</form>



</main>






<script src="../js/elemento.js"></script>


</body>

</html>
