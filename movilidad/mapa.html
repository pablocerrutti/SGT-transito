<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>SGT | Mapa Movilidad Urbana</title>



<link rel="stylesheet" href="../css/admin.css">


<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">



<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">



<style>


#mapa{

width:100%;

height:650px;

border-radius:15px;

}



.botonMapa{

position:absolute;

top:100px;

right:40px;

z-index:999;

background:#0f6fae;

color:white;

padding:15px 25px;

border:none;

border-radius:10px;

font-weight:bold;

cursor:pointer;

}




.modal{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.6);

justify-content:center;

align-items:center;

z-index:2000;

}



.modal-contenido{


background:white;

color:#333;

width:400px;

padding:30px;

border-radius:15px;


}



.modal-contenido input,
.modal-contenido select,
.modal-contenido textarea{


width:100%;

padding:12px;

margin-bottom:15px;

border-radius:8px;

border:1px solid #ccc;


}



</style>



</head>




<body>





<div class="sidebar">



<div class="logo">


<img src="../img/logo.png">


<h2>SGT</h2>


<p>
Dirección de Tránsito y Transportes
</p>


</div>





<ul>



<li onclick="location='dashboard.html'">

<i class="fa-solid fa-house"></i>

Dashboard

</li>





<li class="activo">

<i class="fa-solid fa-map"></i>

Mapa

</li>





<li onclick="location='elementos.html'">

<i class="fa-solid fa-location-dot"></i>

Elementos

</li>






<li onclick="cerrarSesion()">

<i class="fa-solid fa-right-from-bracket"></i>

Salir

</li>



</ul>




</div>








<div class="contenido">



<header>


<div>


<h1>

Mapa de Movilidad Urbana

</h1>


<p>

Infraestructura vial geolocalizada

</p>


</div>



<div class="usuarioNombre"></div>



</header>







<button class="botonMapa" onclick="abrirNuevo()">


<i class="fa-solid fa-plus"></i>

Nuevo elemento


</button>






<div id="mapa"></div>







</div>









<div class="modal" id="modal">


<div class="modal-contenido">



<h2>

Nuevo elemento

</h2>





<select id="tipo">


<option value="Semáforo">

Semáforo

</option>


<option value="Paso peatonal">

Paso peatonal

</option>


<option value="Parada de taxi">

Parada de taxi

</option>


<option value="Carga y descarga">

Carga y descarga

</option>


<option value="Cordón reservado">

Cordón reservado

</option>



</select>






<input id="nombre"
placeholder="Nombre o referencia">





<textarea id="descripcion"
placeholder="Descripción">

</textarea>





<button onclick="guardarElemento()">

Guardar

</button>




<button onclick="cerrarNuevo()">

Cancelar

</button>



</div>


</div>








<script src="../js/permisos.js"></script>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script src="../js/mapa.js"></script>



<script>


permitirModulo("movilidad");


cargarUsuario();




function cerrarSesion(){


localStorage.removeItem("usuarioActual");


window.location="../login.html";


}


</script>




</body>

</html>
