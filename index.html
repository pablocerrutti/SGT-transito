<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SGT | Sistema de Gestión de Tránsito</title>

    <link rel="icon" href="img/logo.png">

    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="login-container">

    <div class="login-left">

        <div class="logo-box">

            <img src="img/logo.png" class="logo" alt="SGT">

            <h1>SGT</h1>

            <h2>Sistema de Gestión de Tránsito</h2>

            <p>Dirección de Tránsito y Transportes</p>

            <small>Versión 1.0</small>

        </div>

    </div>

    <div class="login-right">

        <div class="card-login">

            <h2>Ingreso al Sistema</h2>

            <p>Ingrese sus credenciales institucionales</p>

            <form id="loginForm">

                <label>Usuario</label>

                <input
                    type="text"
                    id="usuario"
                    autocomplete="off"
                    required>

                <label>Contraseña</label>

                <input
                    type="password"
                    id="password"
                    required>

                <button type="submit">

                    INGRESAR

                </button>

            </form>

            <div id="mensaje"></div>

        </div>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/login.js"></script>

</body>

</html>
