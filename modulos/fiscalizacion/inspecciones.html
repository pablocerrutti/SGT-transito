<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SGT | Fiscalización</title>
<link rel="stylesheet" href="../../css/estilos.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="inspecciones.css?v=20260904-4">
</head>
<body>
<main class="contenido sin-sidebar">
<header><div><h1>Fiscalización</h1><p id="usuarioNombre"></p></div><button type="button" id="btnVolver" class="btn-volver"><i class="fa-solid fa-arrow-left"></i> Volver</button></header>
<section id="formularioActuacion" class="formulario">
<h2>Registrar actuación</h2>
<form id="formInspeccion">
<h3>Responsable actuante</h3><label>Número Beta</label><input type="text" id="beta" readonly><label>Inspector</label><input type="text" id="inspector" readonly>
<h3>Datos del vehículo</h3><label>Matrícula <small>(opcional para Movilidad)</small></label><input type="text" id="matricula" maxlength="10"><label>Tipo de actuación</label><select id="tipoActuacion" required><option value="">Seleccione...</option><option value="Fiscalización">Fiscalización</option><option value="Multa">Multa</option><option value="Apercibimiento">Apercibimiento</option><option value="Control">Control Vehicular</option><option value="Notificacion">Notificación</option><option value="Est. Autorizado">Estacionamiento Autorizado</option></select>
<div id="datosBoleta" style="display:none;"><label>Número de boleta</label><input type="text" id="numeroBoleta"></div>
<h3>Datos del infractor</h3><label>Nombre completo <small>(opcional para Movilidad)</small></label><input type="text" id="nombreInfractor"><label>Cédula de identidad <small>(opcional para Movilidad)</small></label><input type="text" id="cedula">
<h3>Detalle de la actuación</h3><label>Descripción</label><textarea id="detalle" maxlength="3000" placeholder="Describa la actuación para facilitar su comprensión y auditoría."></textarea>
<div id="evidenciaVideo"><h3>Evidencia de Fiscalización</h3><label>Video de la actuación <small>(máx. 30 MB)</small></label><input id="video" type="file" accept="video/*"></div>
<div id="fotoActuacion"><h3>Evidencia fotográfica</h3><label>Fotografías de la actuación <small>(máximo 4 imágenes)</small></label><input id="documento" type="file" accept="image/*" multiple><small id="ayudaFotos">Puede seleccionar hasta 4 fotografías.</small></div>
<button type="submit">Guardar actuación</button>
</form><p id="mensaje" aria-live="polite"></p>
</section>
<section id="panelActuaciones"><h2>Actuaciones registradas</h2>
<div id="filtrosSupervisor" class="filtros-actuaciones" style="display:none;"><div><label for="fechaDesde">Desde</label><input type="date" id="fechaDesde"></div><div><label for="fechaHasta">Hasta</label><input type="date" id="fechaHasta"></div><button type="button" id="btnFiltrar"><i class="fa-solid fa-filter"></i> Filtrar</button><button type="button" id="btnLimpiarFiltro"><i class="fa-solid fa-eraser"></i> Limpiar</button></div>
<p id="resumenActuaciones" class="resumen-actuaciones"></p><div id="lista"></div>
</section></main>
<script src="../../js/api.js?v=20260904-4"></script><script src="inspecciones.js?v=20260904-4"></script>
<script>
(function(){
 const tipo=document.getElementById('tipoActuacion'),boleta=document.getElementById('datosBoleta'),documento=document.getElementById('documento'),fotoActuacion=document.getElementById('fotoActuacion'),evidenciaVideo=document.getElementById('evidenciaVideo'),ayudaFotos=document.getElementById('ayudaFotos'),formulario=document.getElementById('formInspeccion');
 const esMovilidad=typeof rol!=='undefined'&&rol==='movilidad', esConsulta=typeof rol!=='undefined'&&(rol==='supervisor'||rol==='consulta movilidad');
 function actualizarVista(){if(!tipo)return;const requiere=tipo.value==='Multa'||tipo.value==='Apercibimiento';boleta.style.display=requiere?'block':'none';if(esMovilidad){evidenciaVideo.style.display='none';documento.required=false;documento.value='';fotoActuacion.style.display='block';ayudaFotos.textContent='Modo Movilidad: puede adjuntar hasta 4 fotografías. El video no se solicita.';}else{evidenciaVideo.style.display='block';fotoActuacion.style.display='block';documento.required=requiere;ayudaFotos.textContent='En Fiscalización la fotografía es obligatoria para multas y apercibimientos. Máximo 4 imágenes.';}}
 if(documento)documento.addEventListener('change',function(){if(documento.files.length>4){documento.value='';mensaje('Puede adjuntar un máximo de 4 fotografías.','error');}});if(tipo)tipo.addEventListener('change',actualizarVista);actualizarVista();
 if(esConsulta&&formulario){formulario.onsubmit=function(ev){ev.preventDefault();mensaje('Este rol es de solo lectura: no puede registrar nuevas actuaciones.','error');};}
 if(esConsulta&&document.body){const aviso=document.getElementById('resumenActuaciones');if(aviso)aviso.dataset.modoConsulta='1';}
 if(esMovilidad&&formulario){formulario.onsubmit=async function(ev){ev.preventDefault();const boton=ev.submitter;if(boton)boton.disabled=true;try{const tipoValor=tipo.value;if(!tipoValor)throw new Error('Debe seleccionar el tipo de actuación.');const detalle=document.getElementById('detalle').value.trim();if(!detalle)throw new Error('Debe describir la actuación.');const archivos=Array.from(documento.files||[]);if(archivos.length>4)throw new Error('Puede adjuntar un máximo de 4 fotografías.');const urls=[];for(const archivo of archivos){const url=await archivoBase64(archivo,10*1024*1024);if(url)urls.push(url);}const datos={beta:'No posee',inspector:usuario.nombre||usuario.usuario||'',usuario:usuario.usuario||'',rol:'movilidad',matricula:document.getElementById('matricula').value.trim().toUpperCase(),tipoActuacion:tipoValor,numeroBoleta:document.getElementById('numeroBoleta').value.trim(),nombreInfractor:document.getElementById('nombreInfractor').value.trim(),cedula:document.getElementById('cedula').value.trim(),detalle:detalle,videoUrl:'',documentoUrl:urls.join(';')};const r=await apiGuardarInspeccion(datos);if(!r||!r.ok)throw new Error(r?.mensaje||'No fue posible guardar la actuación.');mostrarReporteGuardado(r);formulario.reset();cargarInspector();actualizarCamposPorRol();actualizarVista();await cargar();}catch(error){console.error('Error guardando actuación de Movilidad:',error);mensaje(error.message||'No fue posible guardar la actuación.','error');}finally{if(boton)boton.disabled=false;}};}
})();
</script></body></html>
