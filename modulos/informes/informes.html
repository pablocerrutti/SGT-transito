<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SGT | Informes</title>

    <link
        rel="stylesheet"
        href="../../css/estilos.css"
    >

    <link
        rel="stylesheet"
        href="informes.css"
    >

    <link
        rel="stylesheet"
        href="informes-inspecciones.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>


<body>

<main class="contenido sin-sidebar">


    <!-- =========================================
         CABECERA
    ========================================== -->

    <header class="cabecera">

        <div>

            <h1>
                <i class="fa-solid fa-file-lines"></i>
                Informes
            </h1>

            <p id="usuarioNombre"></p>

        </div>


        <button id="btnVolver">

            <i class="fa-solid fa-arrow-left"></i>

            Volver al mapa

        </button>

    </header>



    <!-- =========================================
         INSPECCIONES / INCIDENCIAS
    ========================================== -->

    <section id="seccionInspecciones">

        <div class="inspecciones-cabecera">

            <div>

                <h2>
                    Incidencias
                </h2>

                <p>
                    Seleccione una incidencia para consultar
                    la inspección, evidencia, estado y realizar
                    su resolución.
                </p>

            </div>

        </div>


        <div class="inspecciones-controles">

            <input
                type="search"
                id="buscarInspeccion"
                placeholder="Buscar elemento inspeccionado..."
            >

        </div>


        <p
            id="mensajeInspecciones"
            class="mensaje-inspecciones"
        ></p>


        <div
            id="listaElementosInspeccionados"
            class="lista-elementos-inspeccionados"
        ></div>


        <div
            id="fichaInspeccion"
            class="ficha-inspeccion"
        ></div>

    </section>



    <!-- =========================================
         FILTROS DEL INFORME
    ========================================== -->

    <section class="filtros">


        <select id="filtroLocalidad">

            <option value="">
                Todas las localidades
            </option>

        </select>


        <select id="filtroTipo">

            <option value="">
                Todos los tipos
            </option>

        </select>


        <select id="filtroEstado">

            <option value="">
                Todos los estados
            </option>

        </select>


        <input
            type="search"
            id="buscar"
            placeholder="Buscar elemento..."
        >


        <button id="btnActualizar">

            <i class="fa-solid fa-rotate"></i>

            Actualizar

        </button>


        <button id="btnPDF">

            <i class="fa-solid fa-file-pdf"></i>

            Crear PDF

        </button>

    </section>



    <!-- =========================================
         MENSAJE
    ========================================== -->

    <p id="mensaje"></p>



    <!-- =========================================
         TABLA PRINCIPAL
    ========================================== -->

    <section>

        <h2>
            Informe de elementos
        </h2>


        <table>

            <thead>

                <tr>

                    <th>
                        Código
                    </th>

                    <th>
                        Localidad
                    </th>

                    <th>
                        Tipo
                    </th>

                    <th>
                        Nombre
                    </th>

                    <th>
                        Descripción
                    </th>

                    <th>
                        Dirección
                    </th>

                    <th>
                        Características
                    </th>

                    <th>
                        Estado
                    </th>

                    <th>
                        Coordenadas
                    </th>

                </tr>

            </thead>


            <tbody id="tablaElementos"></tbody>

        </table>

    </section>


</main>



<!-- =========================================
     LIBRERÍAS PDF
========================================== -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
</script>


<script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js">
</script>



<!-- =========================================
     API PRINCIPAL
========================================== -->

<script
    src="../../js/api.js?v=20260916-2">
</script>


<script
    src="../../js/api-inspecciones-fix.js?v=20260916-1">
</script>



<!-- =========================================
     INFORMES
========================================== -->

<script
    src="informes.js?v=20260918-3">
</script>


<script
    src="informes-fix.js?v=20260904-1">
</script>


<script
    src="../../js/auditoria-informes.js?v=20260904-1">
</script>



<!-- =========================================
     INSPECCIONES
========================================== -->

<script
    src="informes-inspecciones.js?v=20260916-2">
</script>


<script
    src="informes-inspecciones-fix.js?v=20260916-2">
</script>


<script
    src="informes-inspecciones-pdf-fix.js?v=20260916-3">
</script>


</body>

</html>
