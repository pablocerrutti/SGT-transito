<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SGT | Inspecciones</title><link rel="stylesheet" href="../../css/estilos.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="inspecciones.css"></head><body><main class="contenido sin-sidebar"><header><div><h1>Inspecciones</h1><p id="usuarioNombre"></p></div><button id="btnVolver">Volver</button></header><section class="formulario"><h2>Registrar incidencia</h2><form id="formInspeccion"><label>Elemento</label><select id="elemento" required></select><label>Descripción de la incidencia</label><textarea id="incidencia" required maxlength="3000"></textarea><label>Video de la inspección <small>(máx. 30 MB)</small></label><input id="video" type="file" accept="video/*"><label>Foto de actuación o boleta de multa <small>(máx. 10 MB)</small></label><input id="documento" type="file" accept="image/*,application/pdf"><button type="submit">Guardar inspección</button></form><p id="mensaje" aria-live="polite"></p></section><section><h2>Inspecciones registradas</h2><div id="lista"></div></section></main><script src="../../js/api.js"></script><script src="inspecciones.js"></script></body></html>
