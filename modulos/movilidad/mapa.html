<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SGT | Movilidad Urbana</title>

<link rel="icon" href="../../img/logo.png">

<link rel="stylesheet" href="../../css/estilos.css">
<link rel="stylesheet" href="mapa.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

</head>

<body>

<div class="sidebar">

    <div class="logo">

        <img src="../../img/logo.png" width="80">

        <h2>SGT</h2>

        <p>Movilidad Urbana</p>

    </div>

    <ul>

        <li class="activo">
            <i class="fa-solid fa-map-location-dot"></i>
            Mapa
        </li>

        <li id="btnElementos">
            <i class="fa-solid fa-list"></i>
            Elementos
        </li>

        <li id="btnInspecciones">
            <i class="fa-solid fa-clipboard-check"></i>
            Inspecciones
        </li>

        <li id="btnDashboard">
            <i class="fa-solid fa-house"></i>
            Dashboard
        </li>

        <li id="btnSalir">
            <i class="fa-solid fa-right-from-bracket"></i>
            Salir
        </li>

    </ul>

</div>

<div class="contenido">

<header>

<div>

<h1>Mapa de Movilidad Urbana</h1>

<p>

Seleccione un punto del mapa para registrar un nuevo elemento.

</p>

</div>

<div id="usuarioActual"></div>

</header>

<div class="barraSuperior">

<select id="filtroTipo">

<option value="">Todos los elementos</option>

</select>

<input
type="text"
id="buscar"
placeholder="Buscar por código, nombre o dirección">

<button id="btnActualizar">

<i class="fa-solid fa-rotate"></i>

Actualizar

</button>

</div>

<div class="contenedorPrincipal">

<div id="map" style="height:700px;"></div>

<div class="panel">

<h2>Nuevo elemento</h2>

<form id="formElemento">

<label>Tipo</label>

<select id="tipo" required></select>

<label>Código</label>

<input
type="text"
id="codigo"
readonly
disabled
placeholder="Se genera automáticamente">

<label>Serie</label>

<input
type="text"
id="serie"
readonly
disabled
placeholder="Se genera automáticamente">

<label>Nombre</label>

<input
type="text"
id="nombre">

<label>Descripción</label>

<textarea id="descripcion"></textarea>

<label>Dirección</label>

<input
type="text"
id="direccion">

<label>Estado</label>

<select id="estado">

<option>Activo</option>
<option>En reparación</option>
<option>Fuera de servicio</option>
<option>Retirado</option>

</select>

<label>Características</label>

<textarea id="caracteristicas"></textarea>

<input type="hidden" id="lat">
<input type="hidden" id="lng">

<button type="submit">

<i class="fa-solid fa-floppy-disk"></i>

Guardar elemento

</button>

</form>

</div>

</div>

</div>

<script src="../../js/api.js"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="mapa.js"></script>

</body>

</html>
