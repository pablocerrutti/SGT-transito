<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>SGT | Gestión de Usuarios</title>


<link rel="stylesheet" href="../css/admin.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>



<body>



<div class="sidebar">



<div class="logo">


<img src="../img/logo.png">


<h2>SGT</h2>


<p>
Dirección de Tránsito y Transportes
</p>


</div>









<ul>



<li onclick="volverDashboard()">



<i class="fa-solid fa-house"></i>


Dashboard


</li>







<li class="activo">


<i class="fa-solid fa-users"></i>


Usuarios


</li>







<li onclick="ir('../movilidad/mapa.html')">


<i class="fa-solid fa-map"></i>


Mapa Movilidad


</li>







<li onclick="ir('../movilidad/informes.html')">


<i class="fa-solid fa-file-pdf"></i>


Informes


</li>







<li onclick="cerrarSesion()">



<i class="fa-solid fa-right-from-bracket"></i>


Cerrar sesión


</li>






</ul>



</div>









<div class="contenido">



<header>


<div>


<h1>

Gestión de Usuarios

</h1>


<p>

Administración de cuentas SGT

</p>


</div>




<div class="usuarioNombre"></div>



</header>








<button 

class="btn-volver"

onclick="volverDashboard()">



<i class="fa-solid fa-arrow-left"></i>


Volver Dashboard


</button>







<button 

class="nuevo"

onclick="abrirModal()">



<i class="fa-solid fa-user-plus"></i>


Nuevo Usuario


</button>











<br><br>







<table>



<thead>


<tr>


<th>

Nombre

</th>


<th>

Usuario

</th>


<th>

Rol

</th>


<th>

Estado

</th>


<th>

Acción

</th>


</tr>


</thead>





<tbody id="tablaUsuarios">


</tbody>





</table>







</div>














<!-- ============================= -->
<!-- MODAL CREAR USUARIO -->
<!-- ============================= -->



<div class="modal" id="modal">



<div class="modal-contenido">



<h2>

Nuevo Usuario

</h2>







<input

id="nombre"

placeholder="Nombre completo">






<input

id="usuario"

placeholder="Usuario de acceso">







<input

id="password"

type="password"

placeholder="Contraseña provisoria">








<label>

Rol

</label>





<select id="rol">


<option value="Supervisor">

Supervisor

</option>



<option value="Movilidad">

Movilidad

</option>



<option value="Inspector">

Inspector

</option>



<option value="SuperAdministrador">

SuperAdministrador

</option>



</select>









<label>

Estado

</label>







<select id="estado">



<option value="Activo">

Activo

</option>



<option value="Inactivo">

Inactivo

</option>



</select>









<div class="modal-footer">





<button

class="btnGuardar"

onclick="guardarUsuario()">



<i class="fa-solid fa-save"></i>


Guardar


</button>







<button

class="btnCancelar"

onclick="cerrarModal()">



Cancelar


</button>







</div>








</div>


</div>














<script src="../js/permisos.js"></script>


<script src="../js/usuarios.js"></script>





<script>



// =====================================
// CONTROL DE ACCESO
// =====================================


permitirModulo("admin");





// =====================================
// CARGAR USUARIO
// =====================================


cargarUsuario();








// =====================================
// NAVEGACION
// =====================================


function ir(ruta){


window.location.href=ruta;


}







function volverDashboard(){


volverSegunRol();


}








function cerrarSesion(){


localStorage.removeItem(

"usuarioActual"

);



window.location="../login.html";



}



</script>





</body>


</html>
