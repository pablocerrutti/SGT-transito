<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SGT | Gestión de Usuarios</title>

<link rel="stylesheet" href="../css/admin.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<div class="sidebar">


<div class="logo">

<img src="../img/logo.png">

<h2>SGT</h2>

<p>
Dirección de Tránsito y Transportes
</p>

</div>



<ul>


<li onclick="location='dashboard.html'">

<i class="fa-solid fa-house"></i>

Dashboard

</li>


<li class="activo">

<i class="fa-solid fa-users"></i>

Usuarios

</li>



<li onclick="location='roles.html'">

<i class="fa-solid fa-user-shield"></i>

Roles

</li>



<li onclick="location='../movilidad/dashboard.html'">

<i class="fa-solid fa-road"></i>

Movilidad Urbana

</li>



<li onclick="cerrarSesion()">

<i class="fa-solid fa-right-from-bracket"></i>

Cerrar sesión

</li>


</ul>


</div>





<div class="contenido">



<header>


<div>

<h1>
Gestión de Usuarios
</h1>


<p>
Crear usuarios y asignar módulos
</p>

</div>



<button class="nuevo" onclick="abrirModal()">

<i class="fa-solid fa-user-plus"></i>

Nuevo Usuario

</button>



</header>





<table>


<thead>


<tr>

<th>
Nombre
</th>


<th>
Usuario
</th>


<th>
Rol
</th>


<th>
Estado
</th>


<th>
Acción
</th>


</tr>


</thead>



<tbody id="tablaUsuarios">


</tbody>



</table>




</div>






<!-- MODAL -->


<div class="modal" id="modal">


<div class="modal-contenido">


<h2>
Nuevo Usuario
</h2>



<input 
id="nombre"
placeholder="Nombre completo">



<input
id="usuario"
placeholder="Usuario">



<input
id="password"
type="password"
placeholder="Contraseña provisoria">





<select id="rol">


<option value="Movilidad Urbana">

Movilidad Urbana

</option>


<option value="Cámaras e Incidencias">

Cámaras e Incidencias

</option>


<option value="Administrador">

Administrador

</option>


</select>





<select id="estado">


<option value="Activo">

Activo

</option>


<option value="Inactivo">

Inactivo

</option>


</select>






<div class="modal-footer">


<button class="btnGuardar" onclick="guardarUsuario()">

Guardar

</button>



<button class="btnCancelar" onclick="cerrarModal()">

Cancelar

</button>



</div>



</div>


</div>





<script src="../js/usuarios.js"></script>


<script>


function cerrarSesion(){

localStorage.removeItem("usuarioActual");

window.location="../login.html";

}


</script>



</body>

</html>
