<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SGT | Administrador</title>


<link rel="stylesheet" href="../css/admin.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>


<body>



<div class="sidebar">



<div class="logo">

<img src="../img/logo.png">

<h2>SGT</h2>

<p>
Dirección de Tránsito y Transportes
</p>

</div>






<ul>



<li class="activo">

<i class="fa-solid fa-house"></i>

Dashboard

</li>





<li 
id="menuUsuarios"
onclick="ir('usuarios.html')">

<i class="fa-solid fa-users"></i>

Usuarios

</li>





<li onclick="ir('../movilidad/mapa.html')">

<i class="fa-solid fa-map"></i>

Mapa Movilidad

</li>





<li onclick="ir('../movilidad/elementos.html')">

<i class="fa-solid fa-location-dot"></i>

Elementos

</li>





<li onclick="ir('../movilidad/informes.html')">

<i class="fa-solid fa-file-lines"></i>

Informes

</li>







<li onclick="cerrarSesion()">

<i class="fa-solid fa-right-from-bracket"></i>

Salir

</li>




</ul>



</div>









<div class="contenido">



<header>


<div>

<h1>

Panel Administrador

</h1>


<p>

Gestión integral SGT

</p>


</div>




<div class="usuarioNombre"></div>



</header>









<button 

onclick="volverDashboard()" 

class="btn-volver">


<i class="fa-solid fa-arrow-left"></i>


Volver Dashboard


</button>









<div class="tarjetas">





<div 

class="card"

id="cardUsuarios"

onclick="ir('usuarios.html')">



<i class="fa-solid fa-users"></i>



<h2>

Usuarios

</h2>



<p>

Administración de cuentas

</p>



</div>









<div class="card"

onclick="ir('../movilidad/mapa.html')">



<i class="fa-solid fa-map-location-dot"></i>



<h2>

Movilidad

</h2>



<p>

Infraestructura vial

</p>



</div>









<div class="card"

onclick="ir('../movilidad/informes.html')">



<i class="fa-solid fa-file-circle-check"></i>



<h2>

Informes

</h2>



<p>

Inspecciones y reportes

</p>



</div>






</div>









</div>











<script src="../js/permisos.js"></script>





<script>



// =====================================
// CONTROL DE ACCESO
// =====================================


let usuarioActual = obtenerUsuario();




if(!usuarioActual){


window.location="../login.html";


}





if(

usuarioActual.rol !== "SuperAdministrador"

&&

usuarioActual.rol !== "Supervisor"

){



volverSegunRol();



}








// =====================================
// MOSTRAR USUARIO
// =====================================


cargarUsuario();








// =====================================
// OCULTAR ADMINISTRACION A SUPERVISOR
// =====================================


function controlarPermisos(){



if(

usuarioActual.rol==="Supervisor"

){



let menu=document.getElementById(

"menuUsuarios"

);



let tarjeta=document.getElementById(

"cardUsuarios"

);



if(menu){

menu.style.display="none";

}



if(tarjeta){

tarjeta.style.display="none";

}



}



}




controlarPermisos();









// =====================================
// NAVEGACION
// =====================================


function ir(pagina){


window.location.href=pagina;


}







// =====================================
// VOLVER SEGUN ROL
// =====================================


function volverDashboard(){



volverSegunRol();



}







// =====================================
// CERRAR SESION
// =====================================


function cerrarSesion(){



localStorage.removeItem(

"usuarioActual"

);



window.location="../login.html";



}



</script>



</body>

</html>
