<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SGT | Cambio de Contraseña</title>

<link rel="stylesheet" href="../css/login.css">

</head>


<body>


<div class="background"></div>


<div class="contenedor">


<div class="titulo">


<img src="../img/logo.png" class="logo">


<h1>
Cambio de Contraseña
</h1>


<p>
Dirección de Tránsito y Transportes
</p>


</div>



<div class="panel" style="max-width:450px;margin:auto;">


<h2>

Primer ingreso

</h2>


<p style="text-align:center;margin-bottom:25px;color:#d8ecff;">

Debe cambiar la contraseña provisoria antes de continuar.

</p>



<input 
type="password" 
id="actual"
placeholder="Contraseña actual">



<input 
type="password" 
id="nueva"
placeholder="Nueva contraseña">



<input 
type="password" 
id="confirmar"
placeholder="Confirmar nueva contraseña">





<button class="btnAdmin" onclick="cambiarPassword()">

Guardar nueva contraseña

</button>



</div>


<footer>

Sistema de Gestión de Tránsito · Versión 1.0

</footer>


</div>



<script src="../js/cambiar-password.js"></script>


</body>

</html>
