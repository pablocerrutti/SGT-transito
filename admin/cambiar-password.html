<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>SGT | Cambio de contraseña</title>


<link rel="stylesheet" href="css/login.css">


</head>


<body>


<div class="background"></div>



<div class="contenedor">



<div class="titulo">


<img src="img/logo.png" class="logo">


<h1>

Cambio obligatorio de contraseña

</h1>


<p>

Primera vez de acceso al Sistema de Gestión de Tránsito

</p>


</div>







<div class="paneles">



<div class="panel">



<h2>

Nueva contraseña

</h2>



<input 
type="password"
id="nuevaPassword"
placeholder="Nueva contraseña">





<input 
type="password"
id="confirmarPassword"
placeholder="Confirmar contraseña">





<button onclick="cambiarPassword()">

GUARDAR CONTRASEÑA

</button>



</div>



</div>







<footer>

Sistema de Gestión de Tránsito · Versión 1.0

</footer>




</div>







<script src="js/cambiar-password.js"></script>



</body>

</html>
