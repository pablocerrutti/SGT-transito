<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>SGT | Cambio de Contraseña</title>


<link rel="stylesheet" href="css/admin.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>


<body>


<div class="sidebar">


<div class="logo">


<img src="img/logo.png">


<h2>SGT</h2>


<p>
Dirección de Tránsito y Transportes
</p>


</div>





<ul>


<li class="activo">

<i class="fa-solid fa-key"></i>

Cambio de contraseña

</li>


<li onclick="cerrarSesion()">

<i class="fa-solid fa-right-from-bracket"></i>

Cerrar sesión

</li>


</ul>


</div>









<div class="contenido">


<header>


<div>

<h1>

Actualizar contraseña

</h1>


<p>

Primer ingreso al sistema

</p>


</div>


<div class="usuarioNombre"></div>


</header>







<div class="tarjetas">



<div class="card" style="max-width:450px;">



<i class="fa-solid fa-lock"></i>


<h2>

Nueva contraseña

</h2>



<p>

Debe cambiar la contraseña provisoria antes de continuar.

</p>





<br>



<input

id="nuevaPassword"

type="password"

placeholder="Nueva contraseña"

style="width:90%;padding:12px;">





<br><br>





<input

id="repetirPassword"

type="password"

placeholder="Repetir contraseña"

style="width:90%;padding:12px;">





<br><br>





<button

class="nuevo"

onclick="cambiarPassword()">


<i class="fa-solid fa-check"></i>

Guardar contraseña


</button>




</div>


</div>







</div>









<script src="js/permisos.js"></script>


<script src="js/cambiar-password.js"></script>



<script>


cargarUsuario();



</script>



</body>

</html>
