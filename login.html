<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>SGT | Acceso al Sistema</title>


<link rel="stylesheet" href="css/login.css">


</head>


<body>


<div class="background"></div>



<div class="contenedor">



<div class="titulo">



<img src="img/logo.png" class="logo">



<h1>

Sistema de Gestión de Tránsito

</h1>



<p>

Dirección de Tránsito y Transportes

</p>



</div>







<div class="paneles">







<!-- ACCESO USUARIO -->

<div class="panel">



<h2>

Acceso Usuario

</h2>




<input

id="usuario"

type="text"

placeholder="Usuario">






<input

id="password"

type="password"

placeholder="Contraseña">






<button

class="btnUsuario"

onclick="ingresar()">

INGRESAR

</button>



</div>









<!-- ADMINISTRACION -->

<div class="panel admin">



<h2>

Administración

</h2>





<input

id="usuario"

type="text"

placeholder="Administrador">






<input

id="password"

type="password"

placeholder="Contraseña">






<button

class="btnAdmin"

onclick="ingresar()">

PANEL ADMINISTRADOR

</button>



</div>






</div>









<footer>


Sistema de Gestión de Tránsito · Versión 1.0


</footer>






</div>







<script src="js/login.js"></script>



</body>

</html>
