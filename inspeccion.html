<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>SGT | Inspección</title>


<link rel="stylesheet" href="css/estilos.css">

<link rel="stylesheet" href="css/inspeccion.css">


</head>



<body>



<header class="topbar">


<div>

<h1>
SGT
</h1>

<p>
Registro de Inspección
</p>

</div>



<button 
class="btn-volver"
onclick="volverMapa()">

Volver Mapa

</button>


</header>





<main class="contenedor">



<section class="tarjeta">


<h2>
Elemento seleccionado
</h2>



<div id="datosElemento">


Cargando...

</div>



</section>






<section class="tarjeta">


<h2>
Nueva inspección
</h2>



<label>
Estado
</label>


<select id="estado">

<option>
Activo
</option>

<option>
Dañado
</option>

<option>
Fuera de servicio
</option>

<option>
Requiere mantenimiento
</option>


</select>





<label>
Observaciones
</label>


<textarea 
id="observaciones"
placeholder="Ingrese detalles de la inspección">
</textarea>






<label>
Fotografía del elemento
</label>


<input 
type="file"
id="foto"
accept="image/*"
capture="environment">






<button 
class="btn-guardar"
onclick="guardarInspeccion()">

Guardar Inspección

</button>



</section>



</main>





<script>


let elemento = null;




document.addEventListener(
"DOMContentLoaded",
()=>{


elemento =
JSON.parse(
localStorage.getItem(
"elementoSeleccionado"
)
);



mostrarElemento();



});





function mostrarElemento(){


let div =
document.getElementById(
"datosElemento"
);



if(!elemento){


div.innerHTML =
`
<p>
No hay elemento seleccionado
</p>
`;

return;

}





div.innerHTML =

`

<p>
<b>Tipo:</b>
${elemento.tipo || ""}
</p>


<p>
<b>Código:</b>
${elemento.codigo || ""}
</p>


<p>
<b>Ubicación:</b>
${elemento.rol || elemento.nombre || ""}
</p>


<p>
<b>Descripción:</b>
${elemento.descripcion || ""}
</p>


`;



}







function guardarInspeccion(){


let inspeccion = {


idElemento:
elemento.id,


codigo:
elemento.codigo,


estado:
document.getElementById(
"estado"
).value,


observaciones:
document.getElementById(
"observaciones"
).value,


fecha:
new Date()
.toISOString()


};



console.log(
"Inspección:",
inspeccion
);



alert(
"Inspección registrada"
);



}





function volverMapa(){


window.location.href =
"mapa.html";


}



</script>



</body>

</html>
